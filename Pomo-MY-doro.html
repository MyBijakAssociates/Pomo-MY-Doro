<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4">

    <!-- Main Container -->
    <div id="app-container" class="glass-panel w-full max-w-md p-8 text-center relative overflow-hidden flex flex-col min-h-[600px] justify-center">
        
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">
                <i class="fas fa-stopwatch text-red-500 mr-2"></i>Pomo-MY-doro
            </h1>
            <p class="text-gray-500">Teknik belajar fokus &amp; santai</p>
        </div>

        <!-- SELECTION SCREEN -->
        <div id="selection-screen" class="space-y-4 flex-grow">
            <h2 class="text-xl font-semibold text-gray-700 mb-6">Pilih Mod Belajar:</h2>
            
            <button onclick="startSession(5, 1, 'Ringkas')" class="w-full bg-white border-2 border-blue-100 hover:border-blue-400 p-4 rounded-xl flex items-center justify-between btn-hover group transition-colors">
                <div class="text-left">
                    <span class="block text-lg font-bold text-gray-800 group-hover:text-blue-600">1) Ringkas</span>
                    <span class="text-sm text-gray-500">5 min Belajar + 1 min Rehat</span>
                </div>
                <i class="fas fa-bolt text-yellow-400 text-2xl"></i>
            </button>

            <button onclick="startSession(10, 2, 'Santai Pomo')" class="w-full bg-white border-2 border-green-100 hover:border-green-400 p-4 rounded-xl flex items-center justify-between btn-hover group transition-colors">
                <div class="text-left">
                    <span class="block text-lg font-bold text-gray-800 group-hover:text-green-600">2) Santai Pomo</span>
                    <span class="text-sm text-gray-500">10 min Belajar + 2 min Rehat</span>
                </div>
                <i class="fas fa-coffee text-amber-600 text-2xl"></i>
            </button>

            <button onclick="startSession(20, 4, 'Masa Penuh')" class="w-full bg-white border-2 border-red-100 hover:border-red-400 p-4 rounded-xl flex items-center justify-between btn-hover group transition-colors">
                <div class="text-left">
                    <span class="block text-lg font-bold text-gray-800 group-hover:text-red-600">3) Masa Penuh</span>
                    <span class="text-sm text-gray-500">20 min Belajar + 4 min Rehat</span>
                </div>
                <i class="fas fa-brain text-pink-500 text-2xl"></i>
            </button>
            
            <div class="mt-6 text-xs text-gray-400">
                <p>Nota: Sila kuatkan sedikit audio peranti anda.</p>
            </div>
            
            <!-- Download Button -->
            <button onclick="downloadApp()" class="mt-8 text-gray-400 hover:text-gray-600 text-xs border border-gray-200 rounded px-3 py-1 hover:bg-gray-50 transition">
                <i class="fas fa-download mr-1"></i> Simpan App ke Laptop (Offline)
            </button>
        </div>

        <!-- TIMER SCREEN -->
        <div id="timer-screen" class="flex-grow flex flex-col justify-center hidden">
            <!-- Status Badge -->
            <div>
                <div id="status-badge" class="inline-block px-6 py-2 rounded-full text-white font-bold text-sm mb-6 shadow-lg bg-blue-600">SEDANG FOKUS</div>
            </div>

            <!-- Timer Display -->
            <div class="relative mb-6">
                <div id="timer-display" class="text-7xl font-bold text-white tracking-wider pulse-anim">04:54</div>
                <p id="cycle-count" class="text-gray-400 mt-2 text-sm">Pusingan: 1</p>
                
                <!-- NEW MESSAGE AREA -->
                <p id="study-message" class="mt-6 text-base font-medium text-indigo-800 italic bg-blue-100 p-3 rounded-lg border border-blue-200 shadow-sm">
                    <i class="fas fa-mobile-alt mr-2"></i> "Telefon pintar yang dimatikan ketika belajar, akan menghidupkan minda menjadi pintar"
                </p>
            </div>

            <!-- Visualizer Bars (Fake UI for Audio) -->
            <div class="flex justify-center space-x-1 mb-8 h-8 items-end" id="audio-visualizer">
                <div class="w-2 bg-blue-400 rounded-t animate-pulse" style="height: 40%"></div>
                <div class="w-2 bg-blue-400 rounded-t animate-pulse" style="height: 70%; animation-delay: 0.1s"></div>
                <div class="w-2 bg-blue-400 rounded-t animate-pulse" style="height: 50%; animation-delay: 0.2s"></div>
                <div class="w-2 bg-blue-400 rounded-t animate-pulse" style="height: 80%; animation-delay: 0.3s"></div>
                <div class="w-2 bg-blue-400 rounded-t animate-pulse" style="height: 60%; animation-delay: 0.4s"></div>
            </div>

            <!-- Controls -->
            <div class="flex justify-center space-x-4 mb-4">
                <button onclick="toggleTimer()" id="toggle-btn" class="bg-blue-600 hover:bg-blue-700 text-white w-16 h-16 rounded-full flex items-center justify-center shadow-lg transition-transform hover:scale-110">
                    <i class="fas fa-pause text-xl"></i>
                </button>
                <button onclick="stopSession()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 w-16 h-16 rounded-full flex items-center justify-center shadow-md transition-transform hover:scale-110">
                    <i class="fas fa-stop text-xl"></i>
                </button>
            </div>

            <!-- Audio Control -->
            <button onclick="toggleMute()" class="mt-2 text-gray-400 hover:text-gray-600 text-sm">
                <i id="mute-icon" class="fas fa-volume-up mr-1"></i> <span id="mute-text">Bunyi: ON</span>
            </button>
        </div>

    </div>

    <!-- AUDIO ENGINE SCRIPT -->
    <script>
        // --- KONFIGURASI MASA & STATE ---
        let studyDuration = 0;
        let breakDuration = 0;
        let currentMode = 'study'; // 'study' or 'break'
        let timeRemaining = 0;
        let timerInterval = null;
        let isPaused = false;
        let cycle = 1;
        let isMuted = false;

        // --- ELEMENTS ---
        const selectionScreen = document.getElementById('selection-screen');
        const timerScreen = document.getElementById('timer-screen');
        const timerDisplay = document.getElementById('timer-display');
        const statusBadge = document.getElementById('status-badge');
        const body = document.body;
        const toggleBtn = document.getElementById('toggle-btn');
        const visualizerBars = document.querySelectorAll('#audio-visualizer div');
        const cycleCount = document.getElementById('cycle-count');
        const studyMessage = document.getElementById('study-message');

        // --- WEB AUDIO API ENGINE ---
        // Kita guna Web Audio API supaya tak perlu load file mp3 luar (mengelakkan broken link)
        let audioCtx;
        let studyOscillators = [];
        let breakIntervalId = null;
        let gainNode = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 1. Bunyi Study: Brown Noise (Hujan/Angin) - Tenang
        function createBrownNoise() {
            const bufferSize = audioCtx.sampleRate * 2; // 2 saat buffer
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                data[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = data[i];
                data[i] *= 3.5; // Compensate for gain
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;
            
            // Filter supaya bunyi lebih "dalam" (seperti hujan lebat di luar tingkap)
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 400; 

            gainNode = audioCtx.createGain();
            gainNode.gain.value = isMuted ? 0 : 0.15; // Volume rendah untuk background

            noise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            noise.start();
            
            return { stop: () => { 
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
                setTimeout(() => noise.stop(), 1000);
            }};
        }
        let lastOut = 0;
        let currentSoundObj = null;

        // 2. Bunyi Rehat: Melodi Ceria (Synth Arpeggio)
        function playBreakMusic() {
            // Mainkan nota mudah berulang-ulang
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C Major
            let noteIndex = 0;

            const playNote = () => {
                if (isPaused) return;
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle'; // Bunyi seperti game 8-bit ceria
                osc.frequency.setValueAtTime(notes[noteIndex % notes.length], audioCtx.currentTime);
                
                gain.gain.setValueAtTime(isMuted ? 0 : 0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
                
                noteIndex++;
            };

            playNote(); // Main serta merta
            breakIntervalId = setInterval(playNote, 500); // Ulang setiap 0.5 saat
        }

        function stopAudio() {
            if (currentSoundObj) {
                currentSoundObj.stop();
                currentSoundObj = null;
            }
            if (breakIntervalId) {
                clearInterval(breakIntervalId);
                breakIntervalId = null;
            }
        }

        function updateAudioMode() {
            stopAudio();
            if (isPaused) return;

            initAudio();
            
            if (currentMode === 'study') {
                currentSoundObj = createBrownNoise();
            } else {
                playBreakMusic();
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('mute-text').innerText = isMuted ? "Bunyi: OFF" : "Bunyi: ON";
            document.getElementById('mute-icon').className = isMuted ? "fas fa-volume-mute mr-1" : "fas fa-volume-up mr-1";
            
            // Update current volume
            if (gainNode) {
                gainNode.gain.value = isMuted ? 0 : (currentMode === 'study' ? 0.15 : 0.1);
            }
            // Untuk break music, ia check variable isMuted setiap kali note dimainkan
        }

        // --- LOGIC APP ---

        function startSession(studyMin, breakMin, label) {
            initAudio(); // Minta permission audio awal-awal
            
            studyDuration = studyMin * 60;
            breakDuration = breakMin * 60;
            
            // Set Initial State
            currentMode = 'study';
            timeRemaining = studyDuration;
            cycle = 1;
            isPaused = false;

            // UI Changes
            selectionScreen.classList.add('hidden');
            timerScreen.classList.remove('hidden');
            cycleCount.innerText = `Pusingan: ${cycle}`;
            
            updateUIForMode();
            startTimerInterval();
            updateAudioMode();
        }

        function updateUIForMode() {
            const minutes = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            const seconds = (timeRemaining % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${minutes}:${seconds}`;

            if (currentMode === 'study') {
                // UI Study: Biru/Tenang
                body.className = "bg-slate-800 min-h-screen flex items-center justify-center p-4 transition-colors duration-1000";
                statusBadge.className = "inline-block px-6 py-2 rounded-full text-white font-bold text-sm mb-6 shadow-lg bg-blue-600";
                statusBadge.innerText = "SEDANG FOKUS";
                timerDisplay.className = "text-7xl font-bold text-white tracking-wider pulse-anim";
                
                // Show Message
                studyMessage.classList.remove('hidden');
                
                // Visualizer Color
                visualizerBars.forEach(bar => bar.className = "w-2 bg-blue-400 rounded-t animate-pulse");
            } else {
                // UI Break: Jingga/Ceria
                body.className = "bg-orange-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-1000";
                statusBadge.className = "inline-block px-6 py-2 rounded-full text-white font-bold text-sm mb-6 shadow-lg bg-orange-500";
                statusBadge.innerText = "MASA REHAT!";
                timerDisplay.className = "text-7xl font-bold text-orange-600 tracking-wider bounce-anim";
                
                // Hide Message
                studyMessage.classList.add('hidden');
                
                // Visualizer Color
                visualizerBars.forEach(bar => bar.className = "w-2 bg-orange-400 rounded-t animate-bounce");
            }
        }

        function startTimerInterval() {
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (timeRemaining > 0) {
                    timeRemaining--;
                    updateUIForMode();
                } else {
                    switchMode();
                }
            }, 1000);
        }

        function switchMode() {
            clearInterval(timerInterval);
            
            // Play notification sound (beeps)
            playNotification();

            if (currentMode === 'study') {
                currentMode = 'break';
                timeRemaining = breakDuration;
            } else {
                currentMode = 'study';
                timeRemaining = studyDuration;
                cycle++;
                cycleCount.innerText = `Pusingan: ${cycle}`;
            }

            updateUIForMode();
            updateAudioMode();
            startTimerInterval();
        }

        function playNotification() {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.connect(g);
            g.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.5);
            g.gain.setValueAtTime(0.5, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function toggleTimer() {
            isPaused = !isPaused;
            const icon = toggleBtn.querySelector('i');
            
            if (isPaused) {
                clearInterval(timerInterval);
                stopAudio(); // Pause audio
                icon.className = "fas fa-play text-xl";
                statusBadge.innerText = "DIHENTIKAN SEMENTARA";
                statusBadge.classList.add("bg-gray-500");
            } else {
                startTimerInterval();
                updateAudioMode(); // Resume audio
                icon.className = "fas fa-pause text-xl";
                statusBadge.classList.remove("bg-gray-500");
                statusBadge.innerText = currentMode === 'study' ? "SEDANG FOKUS" : "MASA REHAT!";
            }
        }

        function stopSession() {
            clearInterval(timerInterval);
            stopAudio();
            selectionScreen.classList.remove('hidden');
            timerScreen.classList.add('hidden');
            body.className = "bg-blue-50 min-h-screen flex items-center justify-center p-4";
        }
        
        function downloadApp() {
            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Pomo-MY-doro.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

    </script>

</body></html>
